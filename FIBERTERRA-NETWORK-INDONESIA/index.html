  <style>
    :root {
      color-scheme: light;
      --magenta: #e8197f;
      --purple: #9954b7;
      --cyan: #18c9df;
      --ink: #16131a;
    }

    @view-transition {
      navigation: auto;
    }

    ::view-transition-old(root) {
      animation: page-exit .18s ease-in both;
    }

    ::view-transition-new(root) {
      animation: page-enter .28s ease-out both;
    }

    @keyframes page-exit {
      to { opacity: 0; }
    }

    @keyframes page-enter {
      from { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: .01ms;
      }
    }

    * { box-sizing: border-box; }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-width: 300px;
      height: 100vh;
      height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(8px, 2vh, 24px) clamp(14px, 3vw, 42px);
      background: #fff;
      color: var(--ink);
      font-family: Arial, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    .skip-link { position: fixed; z-index: 10; top: 12px; left: 12px; padding: 10px 16px; transform: translateY(-160%); border-radius: 8px; background: #fff; color: var(--ink); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
    .skip-link:focus { transform: translateY(0); outline: 3px solid var(--cyan); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .diagram {
      position: relative;
      width: min(100%, 1440px, calc((100svh - 48px) * 1.65));
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      align-items: center;
      aspect-ratio: 1.65;
    }

    .diagram-stage {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      width: min(34%, 480px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
    }

    .brand-core {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      width: 66%;
      aspect-ratio: 1;
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 8%;
      transform: translate(-50%, -50%);
      transition: transform .25s ease;
    }

    .brand-core::before {
      position: absolute;
      inset: 0;
      content: "";
      border: 1px solid rgba(153, 84, 183, .18);
      border-radius: 16%;
      background: #fff;
      box-shadow: 0 16px 40px rgba(32, 22, 35, .12);
      transform: rotate(45deg);
    }

    .brand-core:hover { transform: translate(-50%, -50%) scale(1.04); }

    .brand-core img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      transition: transform .25s ease;
    }

    .brand-core:hover img { transform: scale(1.05); }

    .service-label:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
    }

    .service-label {
      width: 100%;
      min-width: 0;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2vw, 32px);
      padding: clamp(18px, 2.2vw, 32px);
      background: #fff;
      transition: background-color .2s ease, transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .service-label:hover,
    .service-label:focus-visible {
      background: rgba(24, 201, 223, .035);
    }

    .service-label .service-icon {
      display: block;
      flex: 0 0 clamp(96px, 10vw, 160px);
      width: clamp(96px, 10vw, 160px);
      height: clamp(96px, 10vw, 160px);
      object-fit: contain;
      transition: transform .25s ease;
    }

    .service-label .service-picture {
      display: block;
      flex: 0 1 min(56%, 360px);
      width: min(56%, 360px);
      max-width: 360px;
      transition: transform .25s ease;
    }

    .service-label .service-picture img {
      display: block;
      width: 100%;
      height: auto;
    }

    .service-label:hover img,
    .service-label:focus-visible img { transform: scale(1.05); }

    .service-label.enterprise {
      grid-column: 1;
      grid-row: 1;
      flex-direction: row-reverse;
      text-align: right;
    }

    .service-label.broadband {
      grid-column: 2;
      grid-row: 1;
    }

    .service-label.partnership {
      grid-column: 1;
      grid-row: 2;
      flex-direction: row-reverse;
      text-align: right;
    }

    .service-label.cloud {
      grid-column: 2;
      grid-row: 2;
    }

    @media (max-width: 1200px) {
      .diagram {
        width: min(100%, 1040px, calc((100svh - 48px) * 1.42));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        aspect-ratio: 1.42;
      }

      .diagram-stage { width: 34%; }

      .brand-core {
        width: 64%;
        padding: 7%;
      }

      .service-label {
        min-height: 0;
        gap: clamp(14px, 2vw, 24px);
        padding: clamp(18px, 2.4vw, 32px);
      }

      .service-label .service-icon {
        flex-basis: clamp(96px, 11vw, 132px);
        width: clamp(96px, 11vw, 132px);
        height: clamp(96px, 11vw, 132px);
      }

      .service-label .service-picture { flex-basis: min(58%, 280px); width: min(58%, 280px); }
    }

    @media (max-width: 640px) {
      body { padding: 12px 14px; }

      .diagram {
        width: min(100%, 460px, calc((100svh - 24px) * .72));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        aspect-ratio: .72;
      }

      .diagram-stage {
        width: 44%;
      }

      .brand-core {
        width: 62%;
        padding: 6%;
      }

      .service-label {
        min-height: 0;
        flex-direction: column;
        gap: clamp(6px, 1.2vh, 10px);
        padding: clamp(8px, 1.5vh, 18px) 12px;
        text-align: center;
      }

      .service-label.enterprise,
      .service-label.partnership { flex-direction: column; }

      .service-label .service-icon {
        flex: 0 0 clamp(72px, min(20vw, 10vh), 112px);
        width: clamp(72px, min(20vw, 10vh), 112px);
        height: clamp(72px, min(20vw, 10vh), 112px);
      }

      .service-label .service-picture {
        flex-basis: min(100%, 210px);
        width: min(100%, 210px);
      }

      .service-label.enterprise,
      .service-label.broadband { justify-content: flex-start; }

      .service-label.partnership,
      .service-label.cloud { justify-content: flex-end; }
    }

    @media (max-width: 360px) {
      .service-label { gap: 8px; padding: 8px; }
      .service-label { padding-top: 4px; padding-bottom: 4px; }
      .service-label .service-icon { flex-basis: 66px; width: 66px; height: 66px; }
      .service-label .service-picture { flex-basis: min(100%, 150px); width: min(100%, 150px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
